[project]
name = "polars-cli"
version = "2.1"
description = "Polars CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=2.0.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project.scripts]
polars = "polars_cli.cli:cli"

[tool.ruff]
line-length = 150
